services:
  - type: web
    name: ecommerce-api
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ecommerce-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_REFRESH_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@ecommerce.com
      - key: ADMIN_PASSWORD
        value: Admin123!@#

  - type: redis
    name: ecommerce-redis
    plan: free
    ipAllowList: []

databases:
  - name: ecommerce-db
    plan: free
